<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bạn có thông minh không?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .container {
            background: white;
            padding: 50px 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 32px;
            color: #1a1a2e;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0 30px;
            position: relative;
            min-height: 80px;
        }
        .btn {
            padding: 12px 40px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 100px;
        }
        .btn-yes {
            background: #4CAF50;
            color: white;
        }
        .btn-yes:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        .btn-no {
            background: #f44336;
            color: white;
            position: relative;
            transition: left 0.15s ease, top 0.15s ease;
        }
        .message {
            font-size: 18px;
            color: #333;
            margin-top: 15px;
            min-height: 30px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bạn có thông minh không?</h1>
        
        <div class="btn-group" id="btnGroup">
            <button class="btn btn-yes" id="yesBtn">Yes</button>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>
        
        <div class="message" id="message">Nhấn Yes nếu bạn tự tin</div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const message = document.getElementById('message');
        const group = document.getElementById('btnGroup');

        let canMove = true;

        function moveNoButton() {
            if (!canMove) return;

            const groupRect = group.getBoundingClientRect();
            const noRect = noBtn.getBoundingClientRect();

            const btnW = noRect.width;
            const btnH = noRect.height;
            const padding = 5;

            const maxX = groupRect.width - btnW - padding * 2;
            const maxY = groupRect.height - btnH - padding * 2;

            if (maxX < 0 || maxY < 0) return;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            noBtn.style.margin = '0';

            // Khóa di chuyển trong 150ms để tránh giật
            canMove = false;
            setTimeout(() => {
                canMove = true;
            }, 150);
        }

        // Khi di chuột vào nút No -> chạy
        noBtn.addEventListener('mouseenter', moveNoButton);
        
        // Hỗ trợ trên điện thoại (chạm)
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveNoButton();
        }, { passive: false });

        yesBtn.addEventListener('click', function() {
            const msgs = [
                'Đúng rồi! Bạn thông minh đấy! 🎉',
                'Tuyệt vời! Bạn rất thông minh!',
                'Chắc chắn rồi! Bạn là người thông minh!',
                'Yes! Bạn thông minh hơn bạn nghĩ!'
            ];
            message.textContent = msgs[Math.floor(Math.random() * msgs.length)];
            
            // Đưa nút No về vị trí cũ
            noBtn.style.position = '';
            noBtn.style.left = '';
            noBtn.style.top = '';
            noBtn.style.margin = '';
            canMove = true;
        });
    </script>
</body>
</html>
